<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Tax Calculator</h1>
      <p class="subtitle">Calculate estimated income tax quickly.</p>

      <form id="taxForm">
        <label for="income">Annual Income</label>
        <input id="income" type="number" min="0" step="0.01"
               placeholder="Enter annual income" required>

        <label for="deductions">Deductions</label>
        <input id="deductions" type="number" min="0" step="0.01"
               placeholder="Enter deductions" value="0" required>

        <button type="submit">Calculate Tax</button>
      </form>

      <div id="error" class="error" role="alert"></div>

      <section id="result" class="result" hidden>
        <h2>Tax Result</h2>
        <p>Taxable Income: <strong id="taxableIncome">$0.00</strong></p>
        <p>Estimated Tax: <strong id="tax">$0.00</strong></p>
        <p>After-Tax Income: <strong id="afterTax">$0.00</strong></p>
      </section>
    </section>
  </main>

  <script src="taxCalculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
