apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npx
spec:
  workspaces:
    - name: source
  steps:
    - name: npx
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing dependencies..."
        npm install
        echo "Running npm command..."
        npx --version
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing dependencies..."
        npm install
        echo "Running Jasmine tests..."
        npx jasmine